name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: applytrack_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
        run: npx prisma generate

      - name: Push Prisma Schema to Test DB
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
        run: npx prisma db push --skip-generate

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
          TEST_DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
          JWT_SECRET: test_jwt_secret_key_12345
          NODE_ENV: test
        run: npm test

      - name: Build TypeScript Backend
        working-directory: ./backend
        run: npm run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
