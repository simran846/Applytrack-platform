name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Native MySQL on Ubuntu Runner
        run: |
          sudo systemctl start mysql.service
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'rootpassword'; CREATE DATABASE IF NOT EXISTS applytrack_test; FLUSH PRIVILEGES;"
          mysql -u root -prootpassword -e "SHOW DATABASES;"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
        run: npx prisma generate

      - name: Push Prisma Schema to Test DB
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
        run: npx prisma db push --skip-generate

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
          TEST_DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
          JWT_SECRET: test_jwt_secret_key_12345
          NODE_ENV: test
        run: npm test

      - name: Build TypeScript Backend
        working-directory: ./backend
        run: npm run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
