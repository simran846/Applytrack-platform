name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: applytrack_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Push Prisma Schema to Test DB
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
        run: npx prisma db push

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
          TEST_DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/applytrack_test
          JWT_SECRET: test_jwt_secret_key_12345
        run: npm test

      - name: Build TypeScript Backend
        working-directory: ./backend
        run: npm run build

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        run: npm run build
